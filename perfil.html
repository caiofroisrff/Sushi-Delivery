  <main id="pagina-perfil" class="pagina">
    <header class="cabecalho-pagina">
      <span class="etiqueta">minha conta</span>
      <h1>Olá, <span id="nome-usuario"></span></h1>
    </header>

    <div class="grade-pagina">
      <section class="cartao-pagina">
        <h2>Meus dados</h2>
        <form id="form-perfil" class="acoes-pedido">
          <div class="campo">
            <label for="nome-perfil">Nome</label>
            <input id="nome-perfil" type="text" required>
          </div>
          <div class="campo">
            <label for="email-perfil">E-mail</label>
            <input id="email-perfil" type="email" readonly>
          </div>
          <div class="campo">
            <label for="endereco-perfil">Endereço</label>
            <input id="endereco-perfil" type="text" required>
          </div>
          <div class="campo">
            <label for="senha-perfil">Nova senha</label>
            <input id="senha-perfil" type="password" placeholder="Deixe em branco para manter a atual" autocomplete="new-password">
          </div>
          <button type="submit" class="botao-primario">Salvar alterações</button>
        </form>
      </section>

      <section class="cartao-pagina">
        <h2>Meus pedidos</h2>
        <div class="ferramentas-busca">
          <input id="busca-pedidos" type="search" placeholder="Buscar por código, status ou valor">
          <select id="filtro-status">
            <option value="todos">Todos os status</option>
            <option value="Em preparo">Em preparo</option>
            <option value="Saiu para entrega">Saiu para entrega</option>
            <option value="Entregue">Entregue</option>
            <option value="Cancelado">Cancelado</option>
          </select>
        </div>
        <p id="contagem-pedidos" class="cor">0 pedido(s) encontrado(s)</p>
        <ul id="lista-pedidos" class="lista-pedidos"></ul>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
